name: Unit Tests

on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.10.1
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test

      