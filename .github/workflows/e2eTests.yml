name: Cypress Tests

on: push

env:
  BETTER_AUTH_SECRET: random_secret
  BASE_URL: http://localhost:3000
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  VERCEL_ENV: production
  NODE_ENV: testing
  DATABASE_USERNAME: gh_pg_user
  DATABASE_PASSWORD: gh_pg_pass
  DATABASE_PORT: 54321
  DATABASE_HOST: 0.0.0.0
  DATABASE_NAME: nuzlocke-wars
  ABLY_PUBLISH_API_KEY: ${secrets.ABLY_PUBLISH_API_KEY}
  ABLY_SUBSCRIBE_API_KEY: ${secrets.ABLY_SUBSCRIBE_API_KEY}

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.10.1

      - name: Setup DB
        run: docker compose up -d

      - name: Seed DB
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm start
          browser: firefox